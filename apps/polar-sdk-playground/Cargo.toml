[package]
name = "polar-sdk-playground"
edition = "2024"
version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
hmac = "0.13.0"
sha2 = "0.11.1"
jiff = {version = "0.2.38", features = ["serde"] }
bytes = "1.12.1"
http-body-util = "0.1.5"
http = "1.5.0"
http-body = "1.1.0"
futures-util = "0.3.34"
thiserror = "2.0.21"
form_urlencoded = "1.2.2"
percent-encoding = "2.3.2"
tower = { version = "0.5.3", features = ["util"] }
uuid = {version = "1.29.0", features = ["v4", "serde"] }
presence-rs = { version = "0.2.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
serde_urlencoded = "0.7.1"
monostate = "1.0.2"
derive_more = { version = "2.1.1", features = ["full"] }
url = { version = "2.5.8", features = ["serde"] }
eros = { version = "0.8.1", default-features = false }
rrgen = "0.6.0"
tera = "1.20.1"
heck = "0.5.0"
quote = "1.0.47"
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"
oas3 = { version = "0.22.0", features = ["preserve-order"]}
blake3 = "1.8.7"

reqwest = { version = "0.13", default-features = false, features = ["query", "rustls", "stream"] }
reqwest-middleware = { version = "0.5", features = ["query"] }

tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "parking_lot", "rt-multi-thread", "signal", "sync", "time"] }
