[package]
name = "polar-rsh"
version.workspace = true
edition = "2024"
description = "Async Rust SDK for Polar with selectable API versions"
repository.workspace = true
license.workspace = true
readme = "../../README.md"

# Cargo normalizes the shared README path to README.md when packaging.
[lints.cargo]
manual_readme = "allow"

[features]
default = []
presence = ["dep:presence-rs"]
2026-04 = ["presence", "dep:base64", "dep:hmac", "dep:sha2", "dep:jiff", "dep:bytes", "dep:http-body-util", "dep:http", "dep:http-body", "dep:futures-util", "dep:thiserror", "dep:form_urlencoded", "dep:percent-encoding", "dep:tower", "dep:uuid", "dep:serde", "dep:serde_json", "dep:serde_urlencoded", "dep:monostate", "dep:derive_more", "dep:url", "dep:eros", "dep:tokio"]
2026-10 = ["presence", "dep:base64", "dep:hmac", "dep:sha2", "dep:jiff", "dep:bytes", "dep:http-body-util", "dep:http", "dep:http-body", "dep:futures-util", "dep:thiserror", "dep:form_urlencoded", "dep:percent-encoding", "dep:tower", "dep:uuid", "dep:serde", "dep:serde_json", "dep:serde_urlencoded", "dep:monostate", "dep:derive_more", "dep:url", "dep:eros", "dep:tokio"]
2027-01 = ["presence", "dep:base64", "dep:hmac", "dep:sha2", "dep:jiff", "dep:bytes", "dep:http-body-util", "dep:http", "dep:http-body", "dep:futures-util", "dep:thiserror", "dep:form_urlencoded", "dep:percent-encoding", "dep:tower", "dep:uuid", "dep:serde", "dep:serde_json", "dep:serde_urlencoded", "dep:monostate", "dep:derive_more", "dep:url", "dep:eros", "dep:tokio"]

[dependencies]
base64 = { version = "0.23.1", optional = true }
hmac = { version = "0.13.0", optional = true }
sha2 = { version = "0.11.1", optional = true }
jiff = { version = "0.2.38", features = ["serde"], optional = true }
bytes = { version = "1.12.1", optional = true }
http-body-util = { version = "0.1.5", optional = true }
http = { version = "1.5.0", optional = true }
http-body = { version = "1.1.0", optional = true }
futures-util = { version = "0.3.34", optional = true }
thiserror = { version = "2.0.21", optional = true }
form_urlencoded = { version = "1.2.2", optional = true }
percent-encoding = { version = "2.3.2", optional = true }
tower = { version = "0.5.3", features = ["util"], optional = true }
uuid = { version = "1.29.0", features = ["v4", "serde"], optional = true }
presence-rs = { version = "0.2.0", features = ["serde"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
serde_urlencoded = { version = "0.7.1", optional = true }
monostate = { version = "1.0.2", optional = true }
derive_more = { version = "2.1.1", features = ["full"], optional = true }
url = { version = "2.5.8", features = ["serde"], optional = true }
eros = { version = "0.8.1", default-features = false, optional = true }
tokio = { version = "1", features = ["time"], optional = true }
