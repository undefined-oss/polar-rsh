[package]
name = "polar-rsh"
version.workspace = true
edition = "2024"
description = "Async Rust SDK for Polar with selectable API versions"
repository.workspace = true
license.workspace = true
readme = "../../README.md"

# Cargo normalizes the shared README path to README.md when packaging.
[lints.cargo]
manual_readme = "allow"

[features]
default = []
presence = ["dep:presence-rs"]
2026-04 = ["presence", "dep:base64", "dep:chrono", "dep:futures-util", "dep:hmac", "dep:reqwest", "dep:reqwest-middleware", "dep:reqwest-tracing", "dep:serde", "dep:serde_json", "dep:serde_qs", "dep:serde_urlencoded", "dep:sha2", "dep:thiserror", "dep:tokio", "dep:url", "dep:uuid"]
2026-10 = ["presence", "dep:base64", "dep:chrono", "dep:futures-util", "dep:hmac", "dep:reqwest", "dep:reqwest-middleware", "dep:reqwest-tracing", "dep:serde", "dep:serde_json", "dep:serde_qs", "dep:serde_urlencoded", "dep:sha2", "dep:thiserror", "dep:tokio", "dep:url", "dep:uuid"]
2027-01 = ["presence", "dep:base64", "dep:chrono", "dep:futures-util", "dep:hmac", "dep:reqwest", "dep:reqwest-middleware", "dep:reqwest-tracing", "dep:serde", "dep:serde_json", "dep:serde_qs", "dep:serde_urlencoded", "dep:sha2", "dep:thiserror", "dep:tokio", "dep:url", "dep:uuid"]

[dependencies]
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
futures-util = { version = "0.3", optional = true }
hmac = { version = "0.12", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["query", "rustls", "stream"], optional = true }
reqwest-middleware = { version = "0.5", features = ["query"], optional = true }
reqwest-tracing = { version = "0.7", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
serde_qs = { version = "=1.1.3", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
sha2 = { version = "0.10", optional = true }
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["time"], optional = true }
url = { version = "2", features = ["serde"], optional = true }
uuid = { version = "1", features = ["serde"], optional = true }
presence-rs = { version = "=0.2.0", features = ["serde"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "test-util"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["query", "rustls", "stream"] }
reqwest-middleware = { version = "0.5", features = ["query"] }
reqwest-tracing = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }

[[test]]
name = "http_2026_04"
path = "src/v2026_04/tests/http.rs"
required-features = ["2026-04"]

[[test]]
name = "presence_2026_04"
path = "src/v2026_04/tests/presence.rs"
required-features = ["2026-04"]

[[test]]
name = "http_2026_10"
path = "src/v2026_10/tests/http.rs"
required-features = ["2026-10"]

[[test]]
name = "presence_2026_10"
path = "src/v2026_10/tests/presence.rs"
required-features = ["2026-10"]

[[test]]
name = "http_2027_01"
path = "src/v2027_01/tests/http.rs"
required-features = ["2027-01"]

[[test]]
name = "presence_2027_01"
path = "src/v2027_01/tests/presence.rs"
required-features = ["2027-01"]
