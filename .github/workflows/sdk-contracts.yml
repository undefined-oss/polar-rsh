name: REST SDK contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install mold
        uses: rui314/setup-mold@v1
        with:
          version: 3.0.0
          make-default: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install workspace Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Test contract comparisons
        run: cargo nextest run --locked -p sdk-contracts
      - name: Compare REST contracts
        run: |
          for version in $(python3 -c 'import json; print(" ".join(json.load(open("sdkgen.lock.json"))["versions"]))'); do
            cargo run --locked -p sdk-contracts --no-default-features --features "$version" -- --api-version "$version"
          done
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-contract-report
          path: target/sdk-contracts/**/report.json
          if-no-files-found: warn
