[package]
name = "commit-message"
version = "0.0.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
